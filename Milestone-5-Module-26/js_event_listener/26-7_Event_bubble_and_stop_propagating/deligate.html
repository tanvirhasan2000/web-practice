<head>
    <meta charset="UTF-8">

<body>
    <h1>Explole Event Deligate</h1>
    <section>
        <ul id="list-container">
            <li class="item"> Lorem, ipsum dolor1.</li>
            <li class="item"> Lorem, ipsum dolor2.</li>
            <li class="item"> Lorem, ipsum dolor3.</li>
            <li class="item"> Lorem, ipsum dolor4.</li>
            <li class="item"> Lorem, ipsum dolor5.</li>

        </ul>
        <button id="btn-add-item">Add Item </button>
    </section>
    <script>
        // const items = document.getElementsByClassName('item');
        // for(const item of items){
        //     item.addEventListener('click',function(event){
        //         event.target.parentNode.removeChild(event.target);
        //     })
        // }
        document.getElementById('list-container').addEventListener('click',function(event){
            event.target.parentNode.removeChild(event.target);
        })
        document.getElementById('btn-add-item').addEventListener('click',function(){
            const list_item = document.createElement('li');
            list_item.innerText='New Item ';
            // giving the class name 
            list_item.classList.add('item');
            // accesing the whole list to add the item 
            const listContainer = document.getElementById('list-container');
            // put the item into the list . 
            listContainer.appendChild(list_item); 

        })
